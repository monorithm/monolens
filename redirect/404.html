<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>monolens documentation has moved</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this file for any path under /monolens/ that no
      // longer exists, which after the move is all of them. Mapping deep links
      // rather than sending everything to the landing page is the difference
      // between a link that still works and one that merely does not 404.
      (function () {
        // /monolens/<section>/<page>/ -> /opensource/monolens/latest/<NN-section>/<NN-page>/
        // The section and file names both changed when the docs moved into the
        // package repo, so the pairs are listed rather than derived. These are
        // the URLs monolens 0.4.0 published; its pubspec cannot be edited.
        var TABLE = {
                  "start/what-is-monolens": "20-concepts/00-what-is-monolens",
                  "start/getting-started": "00-start/00-tutorial",
                  "guides/capture": "10-recipes/00-capture-a-photo-or-video",
                  "guides/editing": "10-recipes/30-edit-a-still",
                  "guides/annotations": "10-recipes/60-annotate-media",
                  "guides/building-an-editor": "10-recipes/70-render-the-editing-canvas",
                  "guides/testing": "10-recipes/90-test-without-hardware",
                  "reference/api": "30-reference/00-api-map",
                  "reference/platforms": "30-reference/10-platforms",
                  "reference/architecture": "20-concepts/90-architecture"
        };
        var page = window.location.pathname
          .replace(/^\/monolens\/?/, '')
          .replace(/\/$/, '');
        var target = 'https://monorithm.github.io/opensource/monolens/latest/';
        if (page && TABLE[page]) target += TABLE[page] + '/';
        window.location.replace(target + window.location.hash);
      })();
    </script>
    <style>
      body {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        max-width: 34rem;
        margin: 6rem auto;
        padding: 0 1.5rem;
        line-height: 1.6;
        color: #090b0c;
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f9fbfb; background: #090b0c; }
      }
      a { color: #007a55; }
      @media (prefers-color-scheme: dark) { a { color: #00bc7d; } }
    </style>
  </head>
  <body>
    <h1>This has moved</h1>
    <p>
      monolens documentation now lives on the Monorithm site at
      <a href="https://monorithm.github.io/opensource/monolens/latest/">monorithm.github.io/opensource/monolens/latest/</a>.
    </p>
    <p>Redirecting you now.</p>
  </body>
</html>
