<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>monolens documentation has moved</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this file for any path under /monolens/ that no
      // longer exists, which after the move to monodocs is all of them. The
      // old site's routes map one-for-one onto the new ones:
      //
      //   /monolens/guides/capture/
      //   -> /monodocs/monolens/latest/guides/capture/
      //
      // so the deep links in monolens 0.4.0's README and on its pub.dev page
      // keep working rather than landing on a bare "moved" notice. A pubspec
      // that is already published cannot be edited, which is why this is worth
      // carrying rather than just redirecting the root.
      (function () {
        var path = window.location.pathname.replace(/^\/monolens/, '');
        if (path === '' || path === '/') path = '/';
        window.location.replace(
          'https://monorithm.github.io/monodocs/monolens/latest' +
            path +
            window.location.hash
        );
      })();
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 34rem;
        margin: 6rem auto;
        padding: 0 1.5rem;
        line-height: 1.6;
        color: #17151b;
        background: #fcfbfe;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f0eff2; background: #121016; }
      }
      a { color: #5b3bd4; }
      @media (prefers-color-scheme: dark) { a { color: #b4a6ff; } }
    </style>
  </head>
  <body>
    <h1>The monolens docs have moved</h1>
    <p>
      They now live alongside the other Monorithm packages at
      <a href="https://monorithm.github.io/monodocs/monolens/latest/"
        >monorithm.github.io/monodocs/monolens/latest</a
      >.
    </p>
  </body>
</html>
