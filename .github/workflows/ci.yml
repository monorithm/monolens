name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  package:
    name: Package · analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Generated files included: pub.dev's analysis scores formatting across
      # every Dart file in the archive, `.g.dart` and all, so excluding them
      # here would hide a real deduction. The bridge step below re-formats
      # after regenerating, which is what keeps the two checks consistent.
      - name: Verify formatting
        run: git ls-files '*.dart' | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The generated bindings are committed so consumers never need pigeon.
      # That only holds if they actually match the schema.
      #
      # Formatting the Dart output is part of regenerating, not an afterthought:
      # pigeon emits in its own style, so an unformatted `messages.g.dart` costs
      # 10 points on pub.dev's static-analysis score, while a formatted one that
      # is *not* re-formatted here would fail this diff on every single run.
      - name: Verify the generated bridge is in sync
        run: |
          dart run pigeon --input pigeons/monolens_api.dart
          dart format lib/src/messages.g.dart
          if ! git diff --quiet; then
            echo "::error::Generated bindings are stale. Run:"
            echo "  dart run pigeon --input pigeons/monolens_api.dart"
            echo "  dart format lib/src/messages.g.dart"
            git diff --stat
            exit 1
          fi

  android:
    name: Android · build & lint native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build the example
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: iOS · build native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build the example
        working-directory: example
        run: flutter build ios --debug --simulator --no-codesign

  integration:
    name: Integration · real encoders on a simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Written rather than committed, so the repo carries no binaries and the
      # fixture's exact duration and dimensions are what the tests assert on.
      - name: Generate fixtures
        run: swift tool/make_fixture.swift

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Run the integration suite
        working-directory: example
        run: flutter test integration_test -d "$SIMULATOR_UDID"
