name: Website

# Publishes the redirect stub to https://monorithm.github.io/monolens
#
# The documentation itself moved to https://github.com/monorithm/monodocs,
# which serves monolens and monowave together at
# monorithm.github.io/monodocs/monolens/latest/.
#
# This still deploys, and has to: monolens 0.4.0 is published to pub.dev with
# `documentation: https://monorithm.github.io/monolens`, and a published
# pubspec cannot be edited. Without this, GitHub Pages would keep serving the
# last build of the old site forever -- documentation that silently stops
# tracking the package is worse than a redirect.
#
# redirect/404.html maps deep links too, so every URL the old site served lands
# on its counterpart rather than on the new landing page.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

      - id: deployment
        uses: actions/deploy-pages@v5
