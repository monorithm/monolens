name: Website

# Publishes user documentation to https://monorithm.github.io/monolens
on:
  push:
    branches: [main]
    paths: ['website/**', 'pubspec.yaml', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Yarn ships with Node via Corepack; enabling it pins the version from
      # package.json's packageManager field rather than whatever is on PATH.
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
